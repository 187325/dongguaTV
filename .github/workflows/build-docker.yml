name: Build and Push Docker Image

# 触发条件：main分支推送（含Dockerfile/核心代码）、PR提交、手动触发
on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'          # 监控Dockerfile变更
      - '**.js'               # 监控所有js文件（适配Node.js类项目）
      - 'package.json'        # 监控依赖配置
      - 'package-lock.json'   # 补充lock文件监控
  pull_request:
    branches: [ main ]
  workflow_dispatch:          # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    # 权限配置：读取代码、写入GitHub容器仓库
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 登录GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # 当前触发Action的用户
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub自动生成的临时Token（无需手动配置）

      # 3. 初始化Docker Buildx（支持多平台构建）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .                             # 构建上下文（项目根目录）
          push: ${{ github.event_name != 'pull_request' }} # PR事件仅构建不推送，其他事件推送
          platforms: linux/amd64,linux/arm64     # 构建x86/ARM双架构镜像
          # 镜像标签：适配187325/dongguaTV仓库，版本标签可按需修改
          tags: |
            ghcr.io/187325/dongguaTV:latest      # 最新版标签
            ghcr.io/187325/dongguaTV:2024        # 固定版本标签（可自定义）
          # 镜像元数据标签
          labels: |
            org.opencontainers.image.source=https://github.com/187325/dongguaTV
            org.opencontainers.image.description=dongguaTV Project Docker Image
            org.opencontainers.image.licenses=MIT # 可根据项目实际许可证修改
          # 缓存配置（加速后续构建）
          cache-from: type=gha
          cache-to: type=gha,mode=max
